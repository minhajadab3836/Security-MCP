name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install system security utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y dnsutils curl openssl whois

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install project dependencies
        run: uv sync --all-groups

      - name: Run environment audit
        run: uv run python src/security_mcp/audit.py

      - name: Run test suite
        run: uv run pytest -v tests/
